name: CI

on:
  push:
  pull_request:

jobs:
  laix-source:
    name: LA/IX source acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run checked-source regressions
        run: python3 -B laix/tests/run_source_suite.py --log-dir laix/build/acceptance/ci-source
      - name: Publish source results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laix-source-${{ github.run_id }}
          path: laix/build/acceptance/ci-source/
          if-no-files-found: error

  laix-cpu:
    name: LA/IX CPU acceptance
    needs: laix-source
    if: vars.LAIX_TOOLS_RUN_ID != '' && vars.LAIX_TOOLS_ARTIFACT != '' && vars.LAIX_EMULATOR_SHA256 != '' && vars.LAIX_ROM_SHA256 != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/laix-acceptance.yml
    with:
      tools_run_id: ${{ vars.LAIX_TOOLS_RUN_ID }}
      tools_artifact: ${{ vars.LAIX_TOOLS_ARTIFACT }}
      emulator_sha256: ${{ vars.LAIX_EMULATOR_SHA256 }}
      rom_sha256: ${{ vars.LAIX_ROM_SHA256 }}

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The tests run headless: on Linux SDL is built without X11/Wayland,
      # so no desktop development packages are needed.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'Linux' && '-DSDL_UNIX_CONSOLE_BUILD=ON' || '' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Build the demo firmware
        run: python3 mc/mc.py --rom wfw/src/main.m -o build/firmware.rom

      - name: Test the M compiler
        run: python3 mc/tests/run.py --emulator bin/wrm081632

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  # The same tests with AddressSanitizer and UndefinedBehaviorSanitizer:
  # out-of-bounds accesses, use after free, overflows and the like in the
  # emulator fail the test that triggers them.
  sanitize:
    name: sanitizers
    runs-on: ubuntu-latest
    env:
      # SDL's and the C library's own allocations at exit aren't ours
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DWRM081632_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build --parallel

      - name: Build the demo firmware
        run: python3 mc/mc.py --rom wfw/src/main.m -o build/firmware.rom

      - name: Test the M compiler
        run: python3 mc/tests/run.py --emulator bin/wrm081632

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
