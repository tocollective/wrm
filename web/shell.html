<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WRM.081632</title>
<style>
	:root {
		--bg: #f4f4f2;
		--fg: #1d1d1b;
		--muted: #6b6b66;
		--panel: #ffffff;
		--border: #d8d8d2;
		--accent: #2f5fb3;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #151514;
			--fg: #e6e6e1;
			--muted: #9a9a93;
			--panel: #20201e;
			--border: #3a3a36;
			--accent: #7aa2f0;
		}
	}
	body {
		margin: 0;
		padding: 16px;
		background: var(--bg);
		color: var(--fg);
		font: 14px/1.4 system-ui, sans-serif;
	}
	main {
		max-width: 1040px;
		margin: 0 auto;
	}
	canvas {
		display: block;
		width: 100%;
		max-width: 1024px;
		aspect-ratio: 4 / 3;
		margin: 0 auto 12px;
		background: #000;
	}
	#panel {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 6px;
		padding: 8px 12px;
	}
	.row {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 8px;
		padding: 4px 0;
	}
	.row > .name {
		width: 64px;
		font-weight: 600;
	}
	.info {
		color: var(--muted);
	}
	button, .button {
		font: inherit;
		padding: 3px 10px;
		border: 1px solid var(--border);
		border-radius: 4px;
		background: var(--bg);
		color: var(--fg);
		cursor: pointer;
	}
	button:disabled {
		opacity: 0.5;
		cursor: default;
	}
	#status {
		color: var(--accent);
	}
	#output {
		margin: 12px 0 0;
		max-height: 200px;
		overflow: auto;
		font: 12px/1.3 ui-monospace, monospace;
		white-space: pre-wrap;
	}
</style>
</head>
<body>
<main>
	<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
	<div id="panel">
		<div class="row">
			<span class="name">Disk 0</span>
			<label class="button">Load image…<input type="file" id="hdd-file" hidden></label>
			<button id="hdd-download" disabled>Download</button>
			<span class="info" id="hdd-info">no disk</span>
		</div>
		<div class="row">
			<span class="name">Floppy</span>
			<label class="button">Insert…<input type="file" id="floppy-file" hidden></label>
			<button id="floppy-eject" disabled>Eject</button>
			<span class="info" id="floppy-info">no disk</span>
		</div>
		<div class="row">
			<button id="reset">Reset machine</button>
			<button id="forget">Forget saved disks</button>
			<span id="status">Starting…</span>
		</div>
	</div>
	<pre id="output"></pre>
</main>
<script>
// The disk images live in IndexedDB (Emscripten's IDBFS mounted at
// /persist): the machine starts with the ones saved there, the guest's
// writes go back on its FLUSH and every few seconds, and the buttons
// replace, download or forget them.
(function() {
	var PERSIST = "/persist";
	var HDD = PERSIST + "/hdd0.img";
	var FLOPPY = PERSIST + "/floppy.img";
	var SAVE_PERIOD = 5000; // ms

	var output = document.getElementById("output");
	var status = document.getElementById("status");

	function say(text) {
		status.textContent = text;
	}

	function exists(path) {
		try {
			Module.FS.stat(path);
			return true;
		} catch (e) {
			return false;
		}
	}

	function size(path) {
		var bytes = Module.FS.stat(path).size;
		if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
		return Math.round(bytes / 1024) + " KB";
	}

	function showDisks() {
		var hdd = exists(HDD), floppy = exists(FLOPPY);
		document.getElementById("hdd-info").textContent =
			hdd ? size(HDD) + ", saved in this browser" : "no disk";
		document.getElementById("floppy-info").textContent =
			floppy ? size(FLOPPY) + ", saved in this browser" : "no disk";
		document.getElementById("hdd-download").disabled = !hdd;
		document.getElementById("floppy-eject").disabled = !floppy;
	}

	// One save at a time; a request during one makes another after it.
	var saving = false, again = false;
	function persist(done) {
		if (saving) {
			again = true;
			if (done) setTimeout(function() { persist(done); }, 100);
			return;
		}
		saving = true;
		Module.FS.syncfs(false, function(error) {
			saving = false;
			if (error) say("Can't save the disks: " + error);
			if (again) {
				again = false;
				persist();
			}
			if (done) done();
		});
	}

	function readFile(input, then) {
		var file = input.files[0];
		input.value = "";
		if (!file) return;
		file.arrayBuffer().then(function(data) {
			then(new Uint8Array(data), file.name);
		});
	}

	function start() {
		var args = [];
		if (exists(HDD)) args.push("--hdd", HDD);
		if (exists(FLOPPY)) args.push("--floppy", FLOPPY);
		showDisks();
		say("");
		Module.wrmPersist = function() { persist(); };
		setInterval(persist, SAVE_PERIOD);
		document.addEventListener("visibilitychange", function() {
			if (document.hidden) persist();
		});
		Module.callMain(args);
	}

	// A new hard disk needs a new machine: saved, then the page reloads.
	document.getElementById("hdd-file").addEventListener("change", function() {
		readFile(this, function(data, name) {
			if (!confirm("The machine restarts with " + name + " as disk 0."))
				return;
			Module.FS.writeFile(HDD, data);
			say("Saving " + name + "…");
			persist(function() { location.reload(); });
		});
	});

	// A floppy goes in while the machine runs.
	document.getElementById("floppy-file").addEventListener("change", function() {
		readFile(this, function(data, name) {
			Module.ccall("web_floppy_eject", null, [], []);
			Module.FS.writeFile(FLOPPY, data);
			Module.ccall("web_floppy_insert", null, ["string"], [FLOPPY]);
			showDisks();
			say("Inserted " + name);
			persist();
		});
	});

	document.getElementById("floppy-eject").addEventListener("click", function() {
		Module.ccall("web_floppy_eject", null, [], []);
		Module.FS.unlink(FLOPPY);
		showDisks();
		say("Ejected the floppy");
		persist();
	});

	document.getElementById("hdd-download").addEventListener("click", function() {
		var data = Module.FS.readFile(HDD);
		var link = document.createElement("a");
		link.href = URL.createObjectURL(new Blob([data]));
		link.download = "hdd0.img";
		link.click();
		setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
	});

	document.getElementById("reset").addEventListener("click", function() {
		Module.ccall("web_reset", null, [], []);
	});

	document.getElementById("forget").addEventListener("click", function() {
		if (!confirm("Delete the disks saved in this browser and restart?"))
			return;
		Module.ccall("web_floppy_eject", null, [], []);
		if (exists(HDD)) Module.FS.unlink(HDD);
		if (exists(FLOPPY)) Module.FS.unlink(FLOPPY);
		persist(function() { location.reload(); });
	});

	window.Module = {
		canvas: document.getElementById("canvas"),
		noInitialRun: true,
		print: function(text) {
			output.textContent += text + "\n";
			output.scrollTop = output.scrollHeight;
		},
		printErr: function(text) {
			console.warn(text);
		},
		setStatus: function(text) {
			if (text) say(text);
		},
		onRuntimeInitialized: function() {
			var FS = Module.FS;
			FS.mkdir(PERSIST);
			FS.mount(FS.filesystems.IDBFS, {}, PERSIST);
			FS.syncfs(true, function(error) {
				if (error) say("Can't read the saved disks: " + error);
				start();
			});
		},
	};
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
